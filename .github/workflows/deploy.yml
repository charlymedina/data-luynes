# Construit le site (données + pages), vérifie sa cohérence et le publie sur Cloudflare Pages.
# Se lance : à chaque push sur main, chaque lundi à 6 h (heure de Paris, hiver) et à la demande.
# Si une source de données est en panne, sa version précédente (cache data/raw) est réutilisée et signalée sur le site ;
# si les tests de cohérence échouent, rien n'est publié et le site déjà en ligne reste inchangé.
name: Construire et publier

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      retelecharger_tout:
        description: 'Retélécharger toutes les sources (ignore le téléchargement incrémental)'
        type: boolean
        default: false

permissions:
  # « write » uniquement pour enregistrer les archives de données (dernière étape) ; rien d'autre n'est modifié.
  contents: write
  # « write » pour l'issue « Alerte sources de données » (étape après la construction) ; rien d'autre.
  issues: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # Une construction complète télécharge ~110 sources (≈ 13 min fin 2026) ; avec le téléchargement incrémental, la
    # plupart sont réutilisées. Marge confortable avant l'arrêt forcé.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Dernières données téléchargées (data/raw) et extensions DuckDB, gardées d'une construction à l'autre :
      # si une source ne répond pas, sa version précédente est réutilisée au lieu de bloquer la mise à jour.
      - name: Restaurer les données de la construction précédente
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            ~/.duckdb/extensions
          key: donnees-${{ github.run_id }}
          restore-keys: donnees-

      # Téléchargement incrémental : seules les sources modifiées sont retéléchargées (voir scripts/telechargement.ts).
      - name: Préparer les données (SQL) et construire le site
        run: npm run build
        env:
          FORCE_DOWNLOAD: ${{ inputs.retelecharger_tout && '1' || '' }}

      # Si une source a brutalement changé de taille (±10 % par défaut), la publication continue mais une issue
      # « Alerte sources de données » est ouverte (ou mise à jour) : GitHub prévient par e-mail.
      - name: Signaler les sources qui ont brutalement changé
        if: ${{ !cancelled() }}
        run: bash scripts/signaler-alertes.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Vérifier la cohérence des données et des pages
        run: npm test

      - name: Publier sur Cloudflare Pages
        # Le projet Pages « luynes » a été créé une fois pour toutes (mode Pages classique).
        run: npx wrangler pages deploy dist --project-name=luynes --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Les archives (ventes DVF, accidents BAAC, élections) gardent les données que les producteurs ne publient plus
      # ou qui sont trop lourdes à retélécharger. S'il y a du nouveau, on l'enregistre dans le dépôt pour ne jamais le
      # perdre — même si une étape précédente a échoué, pour ne pas refaire le travail. Un push fait par GitHub Actions
      # ne relance pas ce workflow.
      - name: Enregistrer les archives de données (si elles ont changé)
        if: ${{ !cancelled() }}
        run: |
          if [ -z "$(git status --porcelain data/archive)" ]; then
            echo "Archives inchangées."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive
          git commit -m "chore: archives de données mises à jour automatiquement"
          git pull --rebase origin main
          git push origin HEAD:main
