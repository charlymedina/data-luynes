# Construit le site (données + pages) et le publie sur Cloudflare Pages.
# Se lance : à chaque push sur main, chaque lundi à 6 h (heure de Paris, hiver) et à la demande.
# Si une source de données est en panne, la construction échoue et le site déjà en ligne reste inchangé.
name: Construire et publier

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  # « write » uniquement pour enregistrer l'archive des ventes DVF (dernière étape) ; rien d'autre n'est modifié.
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Préparer les données (SQL) et construire le site
        run: npm run build

      - name: Publier sur Cloudflare Pages
        # Le projet Pages « luynes » a été créé une fois pour toutes (mode Pages classique).
        run: npx wrangler pages deploy dist --project-name=luynes --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Les ventes DVF ne restent publiées que ~5 ans : la construction verse les années les plus anciennes dans
      # data/archive/dvf/ (scripts/archive-dvf.ts). S'il y a du nouveau (2 fois par an environ), on l'enregistre
      # dans le dépôt pour ne jamais le perdre. Un push fait par GitHub Actions ne relance pas ce workflow.
      - name: Enregistrer l'archive des ventes DVF (si elle a changé)
        run: |
          if [ -z "$(git status --porcelain data/archive)" ]; then
            echo "Archive DVF inchangée."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive
          git commit -m "chore: archive des ventes DVF mise à jour automatiquement"
          git pull --rebase origin main
          git push origin HEAD:main
