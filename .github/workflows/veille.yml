# Veille mensuelle des nouvelles données ouvertes utiles pour Luynes (voir README, section « Veille mensuelle »).
# Aucun coût d'IA : un script interroge des API publiques et ouvre une issue « Veille données — <mois> » s'il y a du nouveau.
name: Veille mensuelle

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Chercher les nouveaux jeux de données
        run: npx tsx scripts/veille.ts
        env:
          GH_TOKEN: ${{ github.token }}
